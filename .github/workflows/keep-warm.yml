# Free-tier Supabase pauses a project after 7 days without activity, which for a
# seasonal field logger is a normal quiet stretch — and the failure lands on a
# grower standing in a field with an app that just doesn't work. This pings the
# database often enough that the inactivity timer never runs out.
#
# Deliberately loud: a bad response fails the job so GitHub emails us, rather
# than the ping quietly rotting and the pause arriving as a surprise.
name: Keep Supabase warm

on:
  schedule:
    - cron: "17 8 */3 * *"   # every 3 days, comfortably inside the 7-day window
  workflow_dispatch:          # and runnable by hand, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_KEY repository secrets are not set."
            exit 1
          fi

          # Read one row from each table the app uses. A paused project fails DNS
          # or returns a Cloudflare 5xx, so any of these catches it.
          for table in fields field_seasons visits; do
            code=$(curl -sS --max-time 30 -o /tmp/body -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/${table}?select=*&limit=1" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}") || {
                echo "::error::curl failed for ${table} — project may be paused."
                exit 1
              }

            if [ "$code" != "200" ]; then
              echo "::error::${table} returned HTTP ${code} (expected 200)."
              echo "--- response body ---"
              head -c 500 /tmp/body || true
              exit 1
            fi
            echo "${table}: HTTP 200"
          done

          echo "All three tables answered. Inactivity timer reset."
